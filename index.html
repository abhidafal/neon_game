<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NEON SIEGE — Mobile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff006e;
    --neon-yellow: #ffbe0b;
    --neon-green: #06d6a0;
    --neon-purple: #8338ec;
    --neon-orange: #fb5607;
    --neon-ice: #a5f3fc;
    --bg-dark: #020408;
    --bg-panel: rgba(0, 16, 32, 0.65);
    --panel-border: #00f5ff33;
    --glow-cyan: 0 0 8px #00f5ff, 0 0 20px #00f5ff44;
    --glow-pink: 0 0 8px #ff006e, 0 0 20px #ff006e44;
    --glow-yellow: 0 0 8px #ffbe0b, 0 0 20px #ffbe0b44;
    --touchbar-h: 96px;
  }

  /* Animated grid background — visible behind/around the game on big screens */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, #00f5ff0a 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #ff006e0a 0%, transparent 50%),
      linear-gradient(180deg, #000208 0%, #020a14 50%, #000208 100%);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(0deg, #00f5ff0c 1px, transparent 1px),
      linear-gradient(90deg, #00f5ff0c 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: -1;
    animation: gridDrift 40s linear infinite;
    opacity: 0.5;
  }
  @keyframes gridDrift {
    from { transform: translate(0, 0); }
    to { transform: translate(60px, 60px); }
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-dark);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* Mobile flex column layout: canvas area on top, touch bar fixed at bottom */
  #appRoot {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
  }

  #gameWrapper {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }

  #canvasFrame {
    position: relative;
    border-radius: 4px;
    padding: 2px;
    background: linear-gradient(135deg, #00f5ff66 0%, #ff006e44 50%, #8338ec66 100%);
    box-shadow:
      0 0 60px #00f5ff33,
      0 0 120px #00f5ff15,
      0 20px 60px rgba(0,0,0,0.6);
  }
  #canvasFrame::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1px solid #00f5ff22;
    border-radius: 6px;
    pointer-events: none;
  }
  /* Corner brackets */
  #canvasFrame::after {
    content: '';
    position: absolute;
    inset: -14px;
    background:
      linear-gradient(135deg, #00f5ff 0%, #00f5ff 2px, transparent 2px) top left / 18px 18px no-repeat,
      linear-gradient(225deg, #00f5ff 0%, #00f5ff 2px, transparent 2px) top right / 18px 18px no-repeat,
      linear-gradient(45deg,  #00f5ff 0%, #00f5ff 2px, transparent 2px) bottom left / 18px 18px no-repeat,
      linear-gradient(315deg, #00f5ff 0%, #00f5ff 2px, transparent 2px) bottom right / 18px 18px no-repeat;
    pointer-events: none;
    filter: drop-shadow(0 0 4px #00f5ff);
  }

  #gameCanvas {
    display: block;
    background: var(--bg-dark);
    border-radius: 2px;
    image-rendering: pixelated;
    touch-action: none;
  }

  /* HUD overlay sits on top of canvas, doesn't take vertical space */
  #ui {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 520px;
    pointer-events: none;
    z-index: 10;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 12px 0;
    gap: 6px;
  }

  .hud-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
    padding: 6px 10px;
    background: rgba(0, 12, 24, 0.55);
    border: 1px solid #00f5ff22;
    border-radius: 4px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    position: relative;
  }
  .hud-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 6px; height: 6px;
    border-top: 1px solid var(--neon-cyan);
    border-left: 1px solid var(--neon-cyan);
  }
  .hud-block::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 6px; height: 6px;
    border-bottom: 1px solid var(--neon-cyan);
    border-right: 1px solid var(--neon-cyan);
  }

  .hud-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 2px;
    color: #00f5ffaa;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .hud-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
    line-height: 1;
    transition: transform 0.15s;
  }
  .hud-value.bump { transform: scale(1.2); }

  .hud-value.pink { color: var(--neon-pink); text-shadow: var(--glow-pink); }
  .hud-value.yellow { color: var(--neon-yellow); text-shadow: var(--glow-yellow); }

  #livesBar { display: flex; gap: 3px; margin-top: 2px; }
  .life-icon {
    width: 9px; height: 9px;
    background: var(--neon-pink);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 75%, 18% 100%, 0% 38%);
    box-shadow: 0 0 6px #ff006e;
    transition: all 0.2s;
  }
  .life-icon.lost { background: #333; box-shadow: none; }

  #powerupBar {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 6px 12px;
    pointer-events: none;
    z-index: 10;
    background: rgba(0, 12, 24, 0.6);
    border: 1px solid #00f5ff22;
    border-radius: 30px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .powerup-slot {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .powerup-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    border: 1px solid #ffffff22;
    background: #ffffff08;
    transition: all 0.3s;
    position: relative;
  }
  .powerup-icon.active {
    border-color: var(--neon-yellow);
    background: radial-gradient(circle, #ffbe0b33 0%, #ffbe0b11 100%);
    box-shadow: 0 0 14px #ffbe0baa, inset 0 0 8px #ffbe0b44;
    animation: puPulse 1.5s ease-in-out infinite;
  }
  @keyframes puPulse {
    0%, 100% { box-shadow: 0 0 14px #ffbe0baa, inset 0 0 8px #ffbe0b44; }
    50% { box-shadow: 0 0 22px #ffbe0bcc, inset 0 0 12px #ffbe0b66; }
  }
  .powerup-timer {
    font-size: 8px;
    color: var(--neon-yellow);
    text-shadow: 0 0 4px #ffbe0b;
    font-family: 'Orbitron', sans-serif;
    min-height: 10px;
  }

  /* Frozen overlay indicator */
  #frozenIndicator {
    position: absolute;
    top: 50%; left: 12px;
    transform: translateY(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: var(--neon-ice);
    text-shadow: 0 0 8px var(--neon-ice);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    letter-spacing: 2px;
    transition: opacity 0.2s;
  }

  /* Touch controls bar — fixed at bottom */
  #touchBar {
    flex: 0 0 var(--touchbar-h);
    height: var(--touchbar-h);
    background: linear-gradient(180deg, #020a14 0%, #00060c 100%);
    border-top: 1px solid #00f5ff33;
    box-shadow: 0 -4px 20px #00f5ff11, inset 0 1px 0 #00f5ff22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px calc(env(safe-area-inset-bottom) + 4px);
    gap: 10px;
    z-index: 20;
    position: relative;
  }

  .touch-btn {
    flex: 1;
    height: 64px;
    max-width: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--neon-cyan);
    background: linear-gradient(180deg, #001a2855 0%, #00060c88 100%);
    border: 1px solid var(--neon-cyan);
    border-radius: 10px;
    box-shadow: 0 0 12px #00f5ff44, inset 0 0 12px #00f5ff22;
    text-shadow: 0 0 8px var(--neon-cyan);
    cursor: pointer;
    transition: transform 0.05s, background 0.1s, box-shadow 0.1s;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .touch-btn.fire {
    color: var(--neon-pink);
    border-color: var(--neon-pink);
    box-shadow: 0 0 12px #ff006e66, inset 0 0 12px #ff006e22;
    text-shadow: 0 0 8px var(--neon-pink);
    flex: 1.4;
    max-width: 110px;
  }
  .touch-btn.pause {
    flex: 0.6;
    max-width: 56px;
    font-size: 16px;
    color: var(--neon-yellow);
    border-color: var(--neon-yellow);
    box-shadow: 0 0 12px #ffbe0b44, inset 0 0 10px #ffbe0b22;
    text-shadow: 0 0 6px var(--neon-yellow);
  }
  .touch-btn.active, .touch-btn:active {
    transform: scale(0.94);
    background: linear-gradient(180deg, #00f5ff22 0%, #00f5ff11 100%);
    box-shadow: 0 0 20px #00f5ffaa, inset 0 0 18px #00f5ff66;
  }
  .touch-btn.fire.active, .touch-btn.fire:active {
    background: linear-gradient(180deg, #ff006e22 0%, #ff006e11 100%);
    box-shadow: 0 0 20px #ff006eaa, inset 0 0 18px #ff006e66;
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #020d18cc 0%, #000000ee 100%);
    z-index: 100;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 20px;
    text-align: center;
  }
  .overlay.visible { opacity: 1; pointer-events: all; }

  .overlay-panel {
    background: linear-gradient(180deg, rgba(0, 20, 40, 0.7) 0%, rgba(0, 8, 16, 0.85) 100%);
    border: 1px solid #00f5ff44;
    border-radius: 6px;
    padding: 32px 40px;
    box-shadow:
      0 0 60px #00f5ff22,
      inset 0 1px 0 #00f5ff44,
      inset 0 0 40px #00000066;
    position: relative;
    max-width: 90%;
  }
  .overlay-panel::before, .overlay-panel::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--neon-cyan);
    border-style: solid;
  }
  .overlay-panel::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  .overlay-panel::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  .overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(28px, 7vw, 56px);
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-cyan));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }

  .overlay-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(10px, 2.2vw, 14px);
    color: #00f5ffaa;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 22px;
    margin-bottom: 22px;
  }
  .stat-item .label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #ffffff55;
    text-transform: uppercase;
  }
  .stat-item .val {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 16px 44px;
    border: 1px solid var(--neon-cyan);
    background: transparent;
    color: var(--neon-cyan);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s;
    box-shadow: 0 0 20px #00f5ff44, inset 0 0 20px transparent;
    margin-top: 6px;
    -webkit-tap-highlight-color: transparent;
    text-shadow: 0 0 8px var(--neon-cyan);
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
    opacity: 0.3;
  }
  .btn:hover { color: #001020; background: var(--neon-cyan); box-shadow: 0 0 40px var(--neon-cyan), inset 0 0 30px #ffffff66; text-shadow: none; }
  .btn:hover::before { transform: translateX(100%); }
  .btn:active { transform: scale(0.97); }

  .controls-hint {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 22px;
    max-width: 380px;
  }
  .key-hint {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px;
    color: #ffffff77;
    letter-spacing: 1px;
  }
  .key {
    background: linear-gradient(180deg, #ffffff15 0%, #ffffff08 100%);
    border: 1px solid #ffffff44;
    border-radius: 3px;
    padding: 3px 7px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #ffffffcc;
    box-shadow: 0 1px 0 #ffffff22, inset 0 -1px 0 #00000044;
  }

  .gyro-toggle {
    margin-top: 16px;
    font-size: 10px;
    color: #06d6a0;
    border: 1px dashed #06d6a066;
    padding: 10px 18px;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.2s;
  }
  .gyro-toggle:hover { background: #06d6a015; border-style: solid; }
  .gyro-toggle.on { background: #06d6a022; border-style: solid; color: #06d6a0; box-shadow: 0 0 14px #06d6a044; }

  /* ─── RESPONSIVE BREAKPOINTS ──────────────────────────────────── */

  /* Hide touch bar on devices with a real cursor — desktop/laptop */
  @media (hover: hover) and (pointer: fine) {
    #touchBar { display: none; }
    body { cursor: crosshair; }
  }

  /* Tablet portrait: slightly bigger HUD, keep touch bar */
  @media (min-width: 600px) and (max-width: 1024px) {
    .hud-block { min-width: 80px; padding: 8px 14px; }
    .hud-value { font-size: 22px; }
    .hud-label { font-size: 9px; }
    .powerup-icon { width: 36px; height: 36px; font-size: 17px; }
    .life-icon { width: 12px; height: 12px; }
    :root { --touchbar-h: 110px; }
    .touch-btn { height: 78px; max-width: 120px; font-size: 26px; }
    .touch-btn.fire { max-width: 140px; }
  }

  /* Desktop / laptop: bigger HUD, no touch bar */
  @media (min-width: 1025px) {
    .hud-block { min-width: 88px; padding: 10px 16px; }
    .hud-value { font-size: 24px; }
    .hud-label { font-size: 10px; letter-spacing: 3px; }
    .life-icon { width: 13px; height: 13px; }
    .powerup-icon { width: 38px; height: 38px; font-size: 18px; }
    .powerup-timer { font-size: 9px; }
    #powerupBar { gap: 14px; padding: 8px 18px; }
    #comboDisplay { top: 70px; right: 18px; font-size: 13px; }
  }

  /* Very small phones — tighter HUD */
  @media (max-width: 380px) {
    .hud-block { min-width: 50px; padding: 4px 6px; gap: 0; }
    .hud-value { font-size: 14px; }
    .hud-label { font-size: 7px; letter-spacing: 1px; }
    .life-icon { width: 8px; height: 8px; }
    #powerupBar { gap: 6px; padding: 4px 8px; }
    .powerup-icon { width: 26px; height: 26px; font-size: 12px; }
  }

  /* Landscape phone — short height */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --touchbar-h: 70px; }
    .touch-btn { height: 52px; font-size: 18px; }
    #hud { padding: 4px 8px 0; }
    .hud-block { padding: 3px 8px; }
    .hud-value { font-size: 14px; }
    .overlay-panel { padding: 18px 24px; }
    .overlay-title { margin-bottom: 4px; }
    .overlay-sub { margin-bottom: 14px; }
    .controls-hint { margin-top: 10px; }
    .gyro-toggle { margin-top: 8px; padding: 6px 14px; }
  }

  #levelAnnounce {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%) translateY(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 5vw, 40px);
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--neon-yellow);
    text-shadow: 0 0 20px var(--neon-yellow), 0 0 60px #ffbe0b44;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  #comboDisplay {
    position: absolute;
    top: 52px;
    right: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    text-align: right;
  }

  #scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 200;
  }
</style>
</head>
<body>
<div id="appRoot">
  <div id="gameWrapper">
    <div id="canvasFrame">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui">
      <div id="hud">
        <div class="hud-block">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="scoreDisplay">0</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Level</span>
          <span class="hud-value yellow" id="levelDisplay">1</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Missed</span>
          <span class="hud-value pink" id="missedDisplay">0/5</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Lives</span>
          <div id="livesBar">
            <div class="life-icon" id="life0"></div>
            <div class="life-icon" id="life1"></div>
            <div class="life-icon" id="life2"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="comboDisplay"></div>
    <div id="levelAnnounce"></div>
    <div id="frozenIndicator">❄ FROZEN</div>

    <div id="powerupBar">
      <div class="powerup-slot">
        <div class="powerup-icon" id="pu-rapid">⚡</div>
        <div class="powerup-timer" id="pu-rapid-t"></div>
      </div>
      <div class="powerup-slot">
        <div class="powerup-icon" id="pu-big">💥</div>
        <div class="powerup-timer" id="pu-big-t"></div>
      </div>
      <div class="powerup-slot">
        <div class="powerup-icon" id="pu-shield">🛡️</div>
        <div class="powerup-timer" id="pu-shield-t"></div>
      </div>
      <div class="powerup-slot">
        <div class="powerup-icon" id="pu-multi">🔱</div>
        <div class="powerup-timer" id="pu-multi-t"></div>
      </div>
    </div>

    <!-- Start Screen -->
    <div class="overlay visible" id="startScreen">
      <div class="overlay-panel">
        <div class="overlay-title">NEON SIEGE</div>
        <div class="overlay-sub">Survival Shooter</div>
        <button class="btn" id="startBtn">[ ENGAGE ]</button>
        <button class="gyro-toggle" id="gyroBtn">▢ TILT CONTROLS: OFF</button>
        <div class="controls-hint">
          <span class="key-hint"><span class="key">A</span><span class="key">D</span> / <span class="key">←</span><span class="key">→</span> Move</span>
          <span class="key-hint"><span class="key">SPACE</span> Fire</span>
          <span class="key-hint"><span class="key">P</span> Pause</span>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay" id="gameOverScreen">
      <div class="overlay-panel">
        <div class="overlay-title" style="color:unset; -webkit-text-fill-color:unset; background:none; color:var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); animation:none;">GAME OVER</div>
        <div class="overlay-sub">The siege has fallen</div>
        <div class="stat-grid">
          <div class="stat-item"><div class="label">Score</div><div class="val" id="finalScore">0</div></div>
          <div class="stat-item"><div class="label">Level</div><div class="val" id="finalLevel">1</div></div>
          <div class="stat-item"><div class="label">Kills</div><div class="val" id="finalKills">0</div></div>
          <div class="stat-item"><div class="label">Best Combo</div><div class="val" id="finalCombo">0</div></div>
        </div>
        <button class="btn" id="restartBtn">[ RESTART ]</button>
      </div>
    </div>

    <!-- Pause Screen -->
    <div class="overlay" id="pauseScreen">
      <div class="overlay-panel">
        <div class="overlay-title">PAUSED</div>
        <div class="overlay-sub">Systems Suspended</div>
        <button class="btn" id="resumeBtn">[ RESUME ]</button>
      </div>
    </div>

    <div id="scanlines"></div>
  </div>

  <!-- Touch control bar (fixed bottom) -->
  <div id="touchBar">
    <button class="touch-btn" id="btnLeft">◀</button>
    <button class="touch-btn fire" id="btnFire">🔥</button>
    <button class="touch-btn" id="btnRight">▶</button>
    <button class="touch-btn pause" id="btnPause">⏸</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ─── Audio Engine ────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null;
function getAC() { if (!ac) ac = new AC(); return ac; }

function playTone(freq, type='square', dur=0.08, vol=0.15, bend=0) {
  try {
    const a = getAC();
    if (a.state === 'suspended') a.resume();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, a.currentTime);
    if (bend) osc.frequency.exponentialRampToValueAtTime(bend, a.currentTime + dur);
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    osc.start(a.currentTime); osc.stop(a.currentTime + dur);
  } catch(e){}
}

const SFX = {
  shoot:   () => playTone(880, 'square', 0.06, 0.12, 440),
  hit:     () => playTone(440, 'sawtooth', 0.1, 0.18, 220),
  explode: () => { playTone(150, 'sawtooth', 0.2, 0.25, 60); playTone(200, 'square', 0.15, 0.1, 80); },
  bossHit: () => playTone(100, 'sawtooth', 0.3, 0.3, 40),
  powerup: () => { playTone(660, 'sine', 0.1, 0.2, 880); setTimeout(()=>playTone(880,'sine',0.1,0.2,1100),80); },
  crit:    () => playTone(1200,'square',0.12,0.2,600),
  miss:    () => playTone(100,'sawtooth',0.3,0.25,50),
  level:   () => { [440,550,660,880].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.15,0.2),i*80)); },
  shield:  () => playTone(300,'sine',0.2,0.15,500),
  death:   () => { [400,350,300,200,150].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',0.2,0.2),i*100)); },
  enemyShoot: () => playTone(220, 'square', 0.05, 0.08, 110),
  laser:   () => playTone(180, 'sawtooth', 0.4, 0.2, 90),
  freeze:  () => { playTone(300,'sine',0.15,0.15,150); playTone(500,'sine',0.15,0.12,250); },
  teleport:() => playTone(700,'sine',0.2,0.15,1400),
  phase:   () => playTone(450,'sine',0.15,0.1,900)
};

// ─── Canvas Setup ────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_W = 520, GAME_H = 700;
canvas.width = GAME_W; canvas.height = GAME_H;

function resize() {
  const wrap = document.getElementById('gameWrapper');
  const availW = wrap.clientWidth - 24;  // padding for frame + corner brackets
  const availH = wrap.clientHeight - 24;
  if (availW <= 0 || availH <= 0) return;
  const scale = Math.min(availW / GAME_W, availH / GAME_H);
  const w = GAME_W * scale, h = GAME_H * scale;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ui = document.getElementById('ui');
  ui.style.width = w + 'px';
  ui.style.height = h + 'px';
  // Center UI over the (now-framed) canvas
  const frame = document.getElementById('canvasFrame');
  if (frame) {
    const fr = frame.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    ui.style.left = ((fr.left - wr.left) + 2) + 'px';
    ui.style.top = ((fr.top - wr.top) + 2) + 'px';
    ui.style.transform = 'none';
  }
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// ─── Game State ──────────────────────────────────────────────────
let state = 'start';
let score = 0, level = 1, missed = 0, kills = 0;
let comboCount = 0, maxCombo = 0, comboTimer = 0;
let levelKills = 0, killsToLevel = 10;
let frameCount = 0;
let lastTime = 0;
let screenShake = 0, shakeX = 0, shakeY = 0;
let bossActive = false;
let bgStars = [];
let playerFreezeTimer = 0; // seconds remaining frozen
let bossesSpawnedThisCycle = 0;

let puRapid = 0, puBig = 0, puShield = 0, puMulti = 0;
const PU_DUR = 8000;
let lives = 3;

// ─── Input ───────────────────────────────────────────────────────
const keys = {};
const touch = { left:false, right:false, fire:false };
let gyroEnabled = false;
let gyroTilt = 0; // -1 to +1

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyP') {
    if (state === 'playing' || state === 'paused') togglePause();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch button handlers
function bindTouchBtn(id, prop) {
  const el = document.getElementById(id);
  const press = (e) => {
    e.preventDefault();
    touch[prop] = true;
    el.classList.add('active');
    // Resume audio context on first touch (mobile requirement)
    if (ac && ac.state === 'suspended') ac.resume();
    else if (!ac) getAC();
  };
  const release = (e) => {
    e.preventDefault();
    touch[prop] = false;
    el.classList.remove('active');
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}
bindTouchBtn('btnLeft', 'left');
bindTouchBtn('btnRight', 'right');
bindTouchBtn('btnFire', 'fire');

// Pause button — tap-to-toggle, not hold
document.getElementById('btnPause').addEventListener('click', (e) => {
  e.preventDefault();
  if (state === 'playing' || state === 'paused') togglePause();
});

// Gyroscope (iOS permission-aware)
const gyroBtn = document.getElementById('gyroBtn');
function setupGyroListener() {
  window.addEventListener('deviceorientation', (e) => {
    if (!gyroEnabled) return;
    // gamma: left/right tilt in degrees [-90, 90]
    let g = e.gamma;
    if (g == null) return;
    // Account for portrait/landscape — keep simple: portrait assumption
    g = Math.max(-30, Math.min(30, g));
    gyroTilt = g / 30; // normalize to [-1, 1]
  });
}
gyroBtn.addEventListener('click', async () => {
  if (gyroEnabled) {
    gyroEnabled = false;
    gyroTilt = 0;
    gyroBtn.classList.remove('on');
    gyroBtn.textContent = '▢ TILT CONTROLS: OFF';
    return;
  }
  // iOS 13+ requires permission request from a user gesture
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm === 'granted') {
        gyroEnabled = true;
        setupGyroListener();
        gyroBtn.classList.add('on');
        gyroBtn.textContent = '■ TILT CONTROLS: ON';
      } else {
        gyroBtn.textContent = '✕ PERMISSION DENIED';
      }
    } catch (err) {
      gyroBtn.textContent = '✕ NOT AVAILABLE';
    }
  } else {
    gyroEnabled = true;
    setupGyroListener();
    gyroBtn.classList.add('on');
    gyroBtn.textContent = '■ TILT CONTROLS: ON';
  }
});

// ─── Player ──────────────────────────────────────────────────────
const player = {
  x: GAME_W / 2, y: GAME_H - 48,
  w: 44, h: 36,
  spd: 280,
  shootCooldown: 0,
  invincible: 0,
  flashTimer: 0
};

let bullets = [], enemies = [], particles = [], floatingTexts = [], powerups = [];
let enemyBullets = []; // NEW
let spawnTimer = 0;

// ─── Enemy Types ─────────────────────────────────────────────────
const ENEMY_TYPES = {
  drone:    { w:28, h:28, hp:1, speed:90,  score:10, color:'#00f5ff', shape:'diamond',  reward:null },
  tank:     { w:38, h:34, hp:3, speed:60,  score:30, color:'#ff006e', shape:'rect',     reward:null },
  stealth:  { w:24, h:20, hp:1, speed:140, score:20, color:'#8338ec', shape:'arrow',    reward:null, alpha:0.45 },
  bomber:   { w:34, h:30, hp:2, speed:75,  score:25, color:'#fb5607', shape:'hex',      reward:'random' },
  zigzag:   { w:26, h:26, hp:1, speed:100, score:15, color:'#06d6a0', shape:'triangle', reward:null },
  // NEW (Lv7+)
  ghost:    { w:30, h:30, hp:2, speed:80,  score:35, color:'#c4b5fd', shape:'ghost',    reward:'random' },
  laserMech:{ w:40, h:40, hp:4, speed:50,  score:50, color:'#ff5722', shape:'mech',     reward:'random' },
  splitter: { w:34, h:30, hp:2, speed:70,  score:40, color:'#10b981', shape:'splitter', reward:null },
  freezer:  { w:32, h:32, hp:2, speed:65,  score:40, color:'#a5f3fc', shape:'freezer',  reward:'random' },
  swarm:    { w:14, h:14, hp:1, speed:160, score:8,  color:'#ec4899', shape:'swarm',    reward:null },
  drone_split:{ w:18, h:18, hp:1, speed:120, score:15, color:'#10b981', shape:'diamond', reward:null }, // splitter offspring
  // BOSSES
  boss:     { w:80, h:60, hp:30, speed:45, score:200, color:'#ffbe0b', shape:'boss',    reward:'random', isBoss:true },
  megaboss: { w:110, h:80, hp:60, speed:38, score:400, color:'#fb5607', shape:'megaboss',reward:'random', isBoss:true },
  phantomboss:{ w:70, h:60, hp:45, speed:50, score:500, color:'#a855f7', shape:'phantom',reward:'random', isBoss:true }
};

function initStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * GAME_W,
      y: Math.random() * GAME_H,
      r: Math.random() * 1.5 + 0.3,
      spd: Math.random() * 20 + 5,
      bright: Math.random()
    });
  }
}
initStars();

function rnd(a, b) { return Math.random() * (b - a) + a; }
function rndInt(a, b) { return Math.floor(rnd(a, b + 1)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function spawnParticles(x, y, color, count=12, spd=200, lifespan=0.6) {
  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 / count) * i + rnd(-0.2, 0.2);
    const v = rnd(spd * 0.4, spd);
    particles.push({
      x, y,
      vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
      life: lifespan, maxLife: lifespan,
      color, r: rnd(2, 5),
      drag: 0.92
    });
  }
}

function spawnFloatText(x, y, txt, color='#fff', size=14) {
  floatingTexts.push({ x, y, txt, color, size, life: 1.0, vy: -60 });
}

function shakeScreen(amt) { screenShake = Math.max(screenShake, amt); }

// ─── Shooting ────────────────────────────────────────────────────
let shotCooldown = 0;
const BASE_COOLDOWN = 0.22;

function shoot() {
  const cd = puRapid > 0 ? BASE_COOLDOWN * 0.3 : BASE_COOLDOWN;
  if (shotCooldown > 0) return;
  shotCooldown = cd;

  const bulletW = puBig > 0 ? 10 : 5;
  const bulletH = puBig > 0 ? 20 : 14;
  const bulletSpd = 600;
  const bulletDmg = puBig > 0 ? 2 : 1;

  SFX.shoot();

  if (puMulti > 0) {
    [-18, 0, 18].forEach(offset => {
      const angle = offset * Math.PI / 180;
      bullets.push({
        x: player.x + offset, y: player.y - 10,
        w: bulletW - 2, h: bulletH,
        vx: Math.sin(angle) * bulletSpd * 0.5,
        vy: -bulletSpd,
        dmg: bulletDmg, pierce: 0
      });
    });
  } else {
    bullets.push({
      x: player.x, y: player.y - 10,
      w: bulletW, h: bulletH,
      vx: 0, vy: -bulletSpd,
      dmg: bulletDmg, pierce: 0
    });
  }
}

// ─── Enemy Bullet Spawn ──────────────────────────────────────────
function spawnEnemyBullet(x, y, vx, vy, opts={}) {
  enemyBullets.push({
    x, y, vx, vy,
    w: opts.w || 8, h: opts.h || 8,
    color: opts.color || '#ff006e',
    type: opts.type || 'normal', // 'normal' | 'freeze' | 'laser'
    life: opts.life || 5,
    laserH: opts.laserH || 0
  });
}

// ─── Enemy Spawning ───────────────────────────────────────────────
function getSpawnInterval() {
  return Math.max(0.5, 2.0 - (level - 1) * 0.1);
}

function getLevelSpeed() {
  return 1 + (level - 1) * 0.12;
}

function spawnEnemy() {
  if (bossActive) return;

  // Boss every 5 levels — only one per level cycle
  if (level % 5 === 0 && !bossActive && bossesSpawnedThisCycle === 0) {
    spawnBoss(); return;
  }

  let pool = ['drone'];
  if (level >= 2) pool.push('tank');
  if (level >= 3) pool.push('stealth');
  if (level >= 4) pool.push('bomber');
  if (level >= 5) pool.push('zigzag');
  if (level >= 7) pool.push('ghost');
  if (level >= 8) pool.push('laserMech');
  if (level >= 9) pool.push('splitter');
  if (level >= 10) pool.push('freezer');
  if (level >= 11) pool.push('swarm', 'swarm'); // weighted
  pool.push('drone'); // weighted

  const typeName = pool[rndInt(0, pool.length - 1)];
  spawnEnemyOfType(typeName);
}

function spawnEnemyOfType(typeName, x, y) {
  const type = ENEMY_TYPES[typeName];
  const spd = type.speed * getLevelSpeed();
  const sx = x !== undefined ? x : rnd(type.w / 2 + 10, GAME_W - type.w / 2 - 10);
  const sy = y !== undefined ? y : -type.h;

  const e = {
    x: sx, y: sy,
    w: type.w, h: type.h,
    hp: type.hp + Math.floor(level / 4),
    maxHp: type.hp + Math.floor(level / 4),
    spd,
    score: type.score,
    color: type.color,
    shape: type.shape,
    typeName,
    reward: type.reward,
    alpha: type.alpha != null ? type.alpha : 1,
    baseAlpha: type.alpha != null ? type.alpha : 1,
    hitFlash: 0,
    zigDir: 1, zigTimer: rnd(0.5, 1.5),
    angle: 0, rotSpd: rnd(-1.5, 1.5),
    // Special timers
    shootTimer: rnd(1.5, 3.5),
    phaseTimer: rnd(2, 4),
    phaseState: 'visible', // ghost: 'visible' | 'phasing' | 'invisible'
    laserCharge: 0,
    laserActive: 0,
    homingTarget: null
  };
  enemies.push(e);
  return e;
}

function spawnBoss() {
  bossActive = true;
  bossesSpawnedThisCycle++;
  // Rotate boss type by level cycle (every 5 levels)
  const cycle = Math.floor(level / 5);
  const bossTypes = ['boss', 'megaboss', 'phantomboss'];
  const typeName = bossTypes[(cycle - 1) % bossTypes.length];
  const type = ENEMY_TYPES[typeName];
  const hpScale = 1 + (cycle - 1) * 0.4;
  enemies.push({
    x: GAME_W / 2, y: -type.h,
    w: type.w, h: type.h,
    hp: Math.floor(type.hp * hpScale),
    maxHp: Math.floor(type.hp * hpScale),
    spd: type.speed * getLevelSpeed() * 0.7,
    score: type.score * cycle,
    color: type.color,
    shape: type.shape,
    typeName,
    reward: 'random',
    alpha: 1, baseAlpha: 1,
    hitFlash: 0,
    angle: 0, rotSpd: 0,
    bossPhase: 0,
    bossTimer: 0,
    shootTimer: 1.5,
    teleportTimer: 3,
    teleportFlash: 0
  });
  const announceMap = {
    boss: '⚠ BOSS INCOMING ⚠',
    megaboss: '⚠ MEGABOSS APPROACHING ⚠',
    phantomboss: '⚠ PHANTOM BOSS ⚠'
  };
  announceLevel(announceMap[typeName]);
}

function spawnPowerup(x, y) {
  const types = ['rapid', 'big', 'shield', 'multi'];
  const t = types[rndInt(0, types.length - 1)];
  const colors = { rapid: '#ffbe0b', big: '#ff006e', shield: '#00f5ff', multi: '#8338ec' };
  const icons = { rapid: '⚡', big: '💥', shield: '🛡', multi: '🔱' };
  powerups.push({
    x, y, t,
    color: colors[t],
    icon: icons[t],
    vy: 60,
    life: 8.0,
    pulse: 0,
    r: 18
  });
}

// ─── Drawing Functions ────────────────────────────────────────────
function drawGlow(x, y, r, color, alpha=1) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${hexToRgb(color)},${alpha * 0.5})`);
  grad.addColorStop(1, `rgba(${hexToRgb(color)},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer() {
  const { x, y, w, h, flashTimer } = player;

  if (puShield > 0) {
    const pulseR = 32 + Math.sin(frameCount * 0.15) * 4;
    drawGlow(x, y, pulseR * 1.5, '#00f5ff', 0.7);
    ctx.strokeStyle = `rgba(0,245,255,${0.5 + Math.sin(frameCount * 0.2) * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, pulseR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Frozen aura
  if (playerFreezeTimer > 0) {
    drawGlow(x, y, 40, '#a5f3fc', 0.6);
    ctx.strokeStyle = `rgba(165,243,252,${0.6 + Math.sin(frameCount * 0.3) * 0.3})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  const glowColor = puShield > 0 ? '#00f5ff' : (playerFreezeTimer > 0 ? '#a5f3fc' : '#06d6a0');
  drawGlow(x, y, 36, glowColor, 0.4);

  ctx.save();
  ctx.translate(x, y);

  const flash = flashTimer > 0 && Math.floor(flashTimer * 20) % 2 === 0;
  const alpha = player.invincible > 0 ? (flash ? 0.3 : 1) : 1;
  ctx.globalAlpha = alpha;

  const flameH = 10 + Math.sin(frameCount * 0.3) * 4;
  const grad = ctx.createLinearGradient(0, h/2, 0, h/2 + flameH);
  grad.addColorStop(0, '#fb5607cc');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(-8, h/2 - 2, 16, flameH);

  ctx.fillStyle = '#0a1628';
  ctx.strokeStyle = playerFreezeTimer > 0 ? '#a5f3fc' : '#06d6a0';
  ctx.lineWidth = 2;
  ctx.shadowColor = playerFreezeTimer > 0 ? '#a5f3fc' : '#06d6a0';
  ctx.shadowBlur = 10;

  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(w/2, h/4);
  ctx.lineTo(w/3, h/2);
  ctx.lineTo(-w/3, h/2);
  ctx.lineTo(-w/2, h/4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#06d6a044';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-w/4, -h/4);
  ctx.lineTo(-w/2, h/4);
  ctx.moveTo(w/4, -h/4);
  ctx.lineTo(w/2, h/4);
  ctx.stroke();

  ctx.fillStyle = playerFreezeTimer > 0 ? '#a5f3fc' : '#06d6a0';
  ctx.shadowBlur = 6;
  ctx.fillRect(-3, -h/2 - 8, 6, 14);

  ctx.fillStyle = '#00f5ff44';
  ctx.strokeStyle = '#00f5ffaa';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0, -h/8, 8, 10, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBullet(b) {
  const cx = b.x, cy = b.y;
  const isPowered = puBig > 0;
  const color = isPowered ? '#ff006e' : '#00f5ff';
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = isPowered ? 16 : 10;
  const grad = ctx.createLinearGradient(cx, cy, cx + b.vx * 0.02, cy + 20);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(cx - b.w/2, cy, b.w, b.h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - b.w/4, cy, b.w/2, b.h * 0.4);
  ctx.restore();
}

function drawEnemyBullet(b) {
  ctx.save();
  ctx.shadowColor = b.color;
  if (b.type === 'laser') {
    // Vertical laser beam
    ctx.shadowBlur = 30;
    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.laserH);
    grad.addColorStop(0, b.color);
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(1, b.color + '00');
    ctx.fillStyle = grad;
    ctx.fillRect(b.x - b.w/2, b.y, b.w, b.laserH);
    // Core
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(b.x - b.w/4, b.y, b.w/2, b.laserH);
  } else if (b.type === 'freeze') {
    ctx.shadowBlur = 14;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/2, 0, Math.PI * 2);
    ctx.fill();
    // Snowflake-ish lines
    ctx.strokeStyle = '#ffffffcc';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const a = (Math.PI / 3) * i + frameCount * 0.05;
      ctx.beginPath();
      ctx.moveTo(b.x - Math.cos(a) * b.w/2, b.y - Math.sin(a) * b.w/2);
      ctx.lineTo(b.x + Math.cos(a) * b.w/2, b.y + Math.sin(a) * b.w/2);
      ctx.stroke();
    }
  } else {
    ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalAlpha = e.alpha;

  if (e.hitFlash > 0) ctx.globalAlpha = e.alpha * 0.5 + 0.5;

  const col = e.hitFlash > 0 ? '#ffffff' : e.color;
  ctx.shadowColor = col;
  ctx.shadowBlur = (e.shape === 'boss' || e.shape === 'megaboss' || e.shape === 'phantom') ? 25 : 12;
  ctx.strokeStyle = col;
  ctx.fillStyle = '#0a0a14';
  ctx.lineWidth = (e.shape === 'boss' || e.shape === 'megaboss' || e.shape === 'phantom') ? 3 : 2;

  const w = e.w, h = e.h;

  if (e.shape === 'diamond') {
    ctx.beginPath();
    ctx.moveTo(0, -h/2); ctx.lineTo(w/2, 0); ctx.lineTo(0, h/2); ctx.lineTo(-w/2, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = col + '66'; ctx.lineWidth = 1;
    ctx.scale(0.5, 0.5);
    ctx.beginPath();
    ctx.moveTo(0, -h/2); ctx.lineTo(w/2, 0); ctx.lineTo(0, h/2); ctx.lineTo(-w/2, 0);
    ctx.closePath(); ctx.stroke();

  } else if (e.shape === 'rect') {
    ctx.beginPath(); ctx.rect(-w/2, -h/2, w, h); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = col + '44'; ctx.lineWidth = 1;
    ctx.strokeRect(-w/2+4, -h/2+4, w-8, h-8);
    const hpPct = e.hp / e.maxHp;
    ctx.fillStyle = '#ff006e';
    ctx.fillRect(-w/2, h/2 + 3, w * hpPct, 3);

  } else if (e.shape === 'arrow') {
    ctx.beginPath();
    ctx.moveTo(0, -h/2); ctx.lineTo(w/2, h/4); ctx.lineTo(w/4, h/2);
    ctx.lineTo(-w/4, h/2); ctx.lineTo(-w/2, h/4);
    ctx.closePath(); ctx.fill(); ctx.stroke();

  } else if (e.shape === 'hex') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI / 3) * i - Math.PI / 6;
      const px = Math.cos(ang) * w/2, py = Math.sin(ang) * h/2;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();

  } else if (e.shape === 'triangle') {
    ctx.rotate(e.angle);
    ctx.beginPath();
    ctx.moveTo(0, -h/2); ctx.lineTo(w/2, h/2); ctx.lineTo(-w/2, h/2);
    ctx.closePath(); ctx.fill(); ctx.stroke();

  } else if (e.shape === 'ghost') {
    // Wavy bottom ghost shape
    ctx.beginPath();
    ctx.moveTo(-w/2, -h/4);
    ctx.quadraticCurveTo(-w/2, -h/2, 0, -h/2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/4);
    ctx.lineTo(w/2, h/3);
    // wavy bottom
    const segs = 4;
    for (let i = 0; i <= segs; i++) {
      const px = w/2 - (w / segs) * i;
      const py = h/3 + (i % 2 === 0 ? h/6 : 0);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(-w/2, h/3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(-6, -4, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -4, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5, -4, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -4, 1.5, 0, Math.PI*2); ctx.fill();

  } else if (e.shape === 'mech') {
    // Laser mech — squarish with a barrel
    ctx.beginPath();
    ctx.rect(-w/2, -h/2, w, h * 0.7);
    ctx.fill(); ctx.stroke();
    // Barrel
    ctx.fillStyle = col;
    ctx.fillRect(-5, h * 0.2 - 2, 10, h * 0.4);
    // Charge indicator
    if (e.laserCharge > 0) {
      const charge = Math.min(1, e.laserCharge);
      ctx.fillStyle = `rgba(255,255,255,${charge})`;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 20 * charge;
      ctx.beginPath();
      ctx.arc(0, h * 0.6, 4 + charge * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Eyes
    ctx.fillStyle = '#ff5722';
    ctx.fillRect(-w/3, -h/3, 6, 4);
    ctx.fillRect(w/3 - 6, -h/3, 6, 4);
    // HP bar
    const hpPct = e.hp / e.maxHp;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff006e';
    ctx.fillRect(-w/2, h/2 + 3, w * hpPct, 3);

  } else if (e.shape === 'splitter') {
    // Pill / capsule shape with split-line
    ctx.beginPath();
    ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Split line
    ctx.strokeStyle = col + 'aa';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    ctx.beginPath();
    ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0);
    ctx.stroke();
    ctx.setLineDash([]);
    // HP
    const hpPct = e.hp / e.maxHp;
    ctx.fillStyle = '#10b981';
    ctx.fillRect(-w/2, h/2 + 3, w * hpPct, 2);

  } else if (e.shape === 'freezer') {
    // Snowflake-ish shape
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI / 3) * i;
      const px = Math.cos(ang) * w/2, py = Math.sin(ang) * h/2;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Inner cross
    ctx.strokeStyle = '#ffffffaa';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const ang = (Math.PI / 3) * i + frameCount * 0.02;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(ang) * w/3, -Math.sin(ang) * h/3);
      ctx.lineTo(Math.cos(ang) * w/3, Math.sin(ang) * h/3);
      ctx.stroke();
    }
    // HP
    const hpPct = e.hp / e.maxHp;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#a5f3fc';
    ctx.fillRect(-w/2, h/2 + 3, w * hpPct, 2);

  } else if (e.shape === 'swarm') {
    // Tiny pulsing bug
    ctx.rotate(e.angle);
    const pulse = 1 + Math.sin(frameCount * 0.3) * 0.15;
    ctx.beginPath();
    ctx.ellipse(0, 0, (w/2) * pulse, (h/2) * pulse, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // wings
    ctx.fillStyle = col + '66';
    ctx.beginPath();
    ctx.ellipse(-w/2, 0, w/3, h/6, Math.PI/4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w/2, 0, w/3, h/6, -Math.PI/4, 0, Math.PI*2);
    ctx.fill();

  } else if (e.shape === 'boss') {
    const t = frameCount;
    ctx.beginPath(); ctx.rect(-w/2, -h/2, w, h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a0a14'; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w/2, -h/4); ctx.lineTo(-w/2 - 20, h/4); ctx.lineTo(-w/2, h/2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w/2, -h/4); ctx.lineTo(w/2 + 20, h/4); ctx.lineTo(w/2, h/2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    [-w/3, 0, w/3].forEach(cx => { ctx.fillStyle = col; ctx.fillRect(cx - 3, h/2 - 2, 6, 12); });
    const eyePulse = 0.5 + Math.sin(t * 0.1) * 0.5;
    ctx.fillStyle = `rgba(255,${Math.floor(190*eyePulse)},0,${0.5 + eyePulse * 0.5})`;
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
    drawBossHpBar(e);

  } else if (e.shape === 'megaboss') {
    // Fortress shape
    const t = frameCount;
    ctx.beginPath();
    ctx.moveTo(-w/2, h/2);
    ctx.lineTo(-w/2, -h/4);
    ctx.lineTo(-w/3, -h/2);
    ctx.lineTo(w/3, -h/2);
    ctx.lineTo(w/2, -h/4);
    ctx.lineTo(w/2, h/2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Crenelations
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = col;
      ctx.fillRect(i * (w/5) - 5, -h/2 - 8, 10, 8);
    }
    // 5 cannons
    ctx.fillStyle = col;
    [-w*0.4, -w*0.2, 0, w*0.2, w*0.4].forEach(cx => {
      ctx.fillRect(cx - 3, h/2 - 2, 6, 14);
    });
    // Core glow
    const eyePulse = 0.5 + Math.sin(t * 0.08) * 0.5;
    ctx.fillStyle = `rgba(251,86,7,${0.6 + eyePulse * 0.4})`;
    ctx.shadowColor = '#fb5607';
    ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
    drawBossHpBar(e);

  } else if (e.shape === 'phantom') {
    const t = frameCount;
    // Teleport flash
    if (e.teleportFlash > 0) {
      ctx.globalAlpha = e.alpha * (1 - e.teleportFlash);
    }
    // Diamond / mask shape
    ctx.beginPath();
    ctx.moveTo(0, -h/2);
    ctx.lineTo(w/2, -h/6);
    ctx.lineTo(w/2 - 8, h/2);
    ctx.lineTo(-w/2 + 8, h/2);
    ctx.lineTo(-w/2, -h/6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Mask eye-slits
    ctx.fillStyle = col;
    ctx.shadowBlur = 18;
    const eyePulse = 0.5 + Math.sin(t * 0.12) * 0.5;
    ctx.globalAlpha = (e.alpha) * (0.5 + eyePulse * 0.5);
    ctx.fillRect(-w/3, -h/8, w/4, 5);
    ctx.fillRect(w/3 - w/4, -h/8, w/4, 5);
    ctx.globalAlpha = e.alpha;
    drawBossHpBar(e);
  }

  ctx.restore();
}

function drawBossHpBar(e) {
  const w = e.w;
  const hpPct = e.hp / e.maxHp;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#333';
  ctx.fillRect(-w/2, -e.h/2 - 12, w, 7);
  ctx.fillStyle = hpPct > 0.5 ? '#06d6a0' : hpPct > 0.25 ? '#ffbe0b' : '#ff006e';
  ctx.fillRect(-w/2, -e.h/2 - 12, w * hpPct, 7);
  ctx.strokeStyle = e.color + '55';
  ctx.lineWidth = 1;
  ctx.strokeRect(-w/2, -e.h/2 - 12, w, 7);
}

function drawParticle(p) {
  const alpha = p.life / p.maxLife;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 6;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPowerup(pu) {
  ctx.save();
  ctx.translate(pu.x, pu.y);
  const pulse = Math.sin(pu.pulse) * 0.15 + 1;
  ctx.scale(pulse, pulse);
  ctx.globalAlpha = Math.min(1, pu.life * 0.5);

  drawGlow(0, 0, 30, pu.color, 0.5);

  ctx.strokeStyle = pu.color;
  ctx.fillStyle = pu.color + '22';
  ctx.lineWidth = 2;
  ctx.shadowColor = pu.color;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ang = (Math.PI / 3) * i;
    const px = Math.cos(ang) * 18, py = Math.sin(ang) * 18;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.font = '16px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pu.icon, 0, 0);

  ctx.restore();
}

function drawBackground(dt) {
  const grad = ctx.createLinearGradient(0, 0, 0, GAME_H);
  grad.addColorStop(0, '#020408');
  grad.addColorStop(1, '#00080f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  const t = frameCount * 0.002;
  const ng = ctx.createRadialGradient(GAME_W*0.3 + Math.sin(t)*30, GAME_H*0.4, 0, GAME_W*0.3, GAME_H*0.4, 220);
  ng.addColorStop(0, '#00f5ff05');
  ng.addColorStop(1, 'transparent');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  bgStars.forEach(s => {
    s.y += s.spd * dt;
    if (s.y > GAME_H + 2) { s.y = -2; s.x = Math.random() * GAME_W; }
    const bright = 0.3 + s.bright * 0.7 * (0.8 + Math.sin(frameCount * 0.03 + s.x) * 0.2);
    ctx.fillStyle = `rgba(255,255,255,${bright})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.strokeStyle = '#00f5ff08';
  ctx.lineWidth = 1;
  const gridY = GAME_H - 60;
  for (let x = 0; x < GAME_W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, gridY); ctx.lineTo(x, GAME_H); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, gridY); ctx.lineTo(GAME_W, gridY); ctx.stroke();
}

function drawFloatingText(ft) {
  ctx.save();
  ctx.globalAlpha = ft.life;
  ctx.fillStyle = ft.color;
  ctx.shadowColor = ft.color;
  ctx.shadowBlur = 8;
  ctx.font = `bold ${ft.size}px 'Orbitron', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ft.txt, ft.x, ft.y);
  ctx.restore();
}

function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw/2 < bx + bw/2 && ax + aw/2 > bx - bw/2 &&
         ay - ah/2 < by + bh/2 && ay + ah/2 > by - bh/2;
}

// ─── Update ───────────────────────────────────────────────────────
function update(dt) {
  frameCount++;

  // Decrement freeze timer
  if (playerFreezeTimer > 0) playerFreezeTimer = Math.max(0, playerFreezeTimer - dt);

  // Player movement: keyboard, touch, or gyroscope
  const freezeMod = playerFreezeTimer > 0 ? 0.3 : 1.0;
  const spd = player.spd * freezeMod;

  let dx = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || touch.left) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD'] || touch.right) dx += 1;
  if (gyroEnabled && Math.abs(gyroTilt) > 0.1) dx += gyroTilt;
  dx = clamp(dx, -1, 1);
  player.x += dx * spd * dt;
  player.x = clamp(player.x, player.w/2, GAME_W - player.w/2);

  // Shoot
  if (keys['Space'] || keys['ArrowUp'] || touch.fire) shoot();
  shotCooldown = Math.max(0, shotCooldown - dt);

  puRapid  = Math.max(0, puRapid - dt * 1000);
  puBig    = Math.max(0, puBig - dt * 1000);
  puShield = Math.max(0, puShield - dt * 1000);
  puMulti  = Math.max(0, puMulti - dt * 1000);

  if (player.invincible > 0) {
    player.invincible -= dt;
    player.flashTimer = player.invincible;
  }

  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }

  if (screenShake > 0) {
    screenShake -= dt * 120;
    if (screenShake > 0) {
      shakeX = rnd(-screenShake, screenShake);
      shakeY = rnd(-screenShake, screenShake);
    } else { shakeX = shakeY = 0; }
  }

  // Bullets
  bullets = bullets.filter(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    return b.y + b.h > 0 && b.y < GAME_H && b.x > 0 && b.x < GAME_W;
  });

  // Enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) return false;
    if (b.y > GAME_H + 20 || b.y < -20 || b.x < -20 || b.x > GAME_W + 20) return false;
    // Collide with player
    if (player.invincible <= 0) {
      const hitH = b.type === 'laser' ? b.laserH : b.h;
      const hitY = b.type === 'laser' ? b.y + b.laserH/2 : b.y;
      if (rectOverlap(player.x, player.y, player.w * 0.6, player.h * 0.6, b.x, hitY, b.w, hitH)) {
        if (puShield > 0) {
          puShield = 0;
          SFX.shield();
          shakeScreen(8);
          spawnParticles(player.x, player.y, '#00f5ff', 16, 240, 0.5);
          spawnFloatText(player.x, player.y - 30, 'SHIELD!', '#00f5ff', 13);
          return false;
        }
        if (b.type === 'freeze') {
          playerFreezeTimer = 2.5;
          SFX.freeze();
          spawnParticles(player.x, player.y, '#a5f3fc', 14, 180, 0.6);
          spawnFloatText(player.x, player.y - 30, 'FROZEN!', '#a5f3fc', 13);
          return false;
        }
        // Normal/laser bullet damage
        lives--;
        missed++;
        player.invincible = 1.5;
        SFX.hit();
        shakeScreen(15);
        spawnParticles(player.x, player.y, '#ff006e', 18, 240, 0.7);
        spawnFloatText(player.x, player.y - 30, 'HIT!', '#ff006e', 14);
        updateHUD();
        if (lives <= 0 || missed >= 5) setTimeout(endGame, 100);
        return false;
      }
    }
    return true;
  });

  // Spawn timer
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = getSpawnInterval();
    spawnEnemy();
  }

  // Enemies
  enemies = enemies.filter(e => {
    // Movement & per-type behavior
    if (e.shape === 'boss' || e.shape === 'megaboss' || e.shape === 'phantom') {
      e.bossTimer += dt;
      if (e.shape === 'phantom') {
        // Phantom: teleport every few seconds
        e.teleportTimer -= dt;
        if (e.teleportFlash > 0) e.teleportFlash = Math.max(0, e.teleportFlash - dt * 2);
        if (e.teleportTimer <= 0) {
          e.x = rnd(80, GAME_W - 80);
          e.y = rnd(80, 220);
          e.teleportTimer = rnd(3, 5);
          e.teleportFlash = 1;
          SFX.teleport();
          spawnParticles(e.x, e.y, e.color, 18, 200, 0.6);
        } else {
          // Hover
          if (e.y < 120) e.y += e.spd * dt;
          else e.y = 120 + Math.sin(e.bossTimer * 1.2) * 30;
        }
      } else {
        const targetX = GAME_W/2 + Math.sin(e.bossTimer * 0.8) * (GAME_W * 0.35);
        e.x = lerp(e.x, targetX, dt * 1.5);
        if (e.y < 100) e.y += e.spd * dt;
      }
      // Boss shooting
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        bossShoot(e);
      }
      if (e.hp <= e.maxHp * 0.5 && e.shape === 'boss') {
        e.spd = ENEMY_TYPES.boss.speed * getLevelSpeed() * 1.2;
      }

    } else if (e.typeName === 'zigzag') {  // FIXED: was e.shape === 'zigzag' but shape is 'triangle'
      e.zigTimer -= dt;
      if (e.zigTimer <= 0) {
        e.zigDir *= -1;
        e.zigTimer = rnd(0.4, 1.2);
      }
      e.x += e.zigDir * e.spd * dt * 0.8;
      e.x = clamp(e.x, e.w/2 + 5, GAME_W - e.w/2 - 5);
      e.y += e.spd * dt;

    } else if (e.typeName === 'ghost') {
      // Phase in/out: invincible while phasing
      e.phaseTimer -= dt;
      if (e.phaseTimer <= 0) {
        if (e.phaseState === 'visible') {
          e.phaseState = 'invisible';
          e.alpha = 0.15;
          e.phaseTimer = rnd(1.2, 2.0);
          SFX.phase();
        } else {
          e.phaseState = 'visible';
          e.alpha = 1;
          e.phaseTimer = rnd(2.5, 4.0);
        }
      }
      e.y += e.spd * dt;
      e.x += Math.sin(e.bossTimer + frameCount * 0.02) * 30 * dt;
      e.bossTimer = (e.bossTimer || 0) + dt;

    } else if (e.typeName === 'laserMech') {
      // Charges and fires laser
      e.y += e.spd * dt * (e.laserActive > 0 ? 0.2 : 1);
      if (e.y > 80 && e.laserActive <= 0 && e.laserCharge < 1) {
        e.laserCharge += dt * 0.6;
        if (e.laserCharge >= 1) {
          // Fire laser
          e.laserActive = 1.0;
          e.laserCharge = 0;
          SFX.laser();
          spawnEnemyBullet(e.x, e.y + e.h * 0.4, 0, 0, {
            w: 10, type: 'laser', color: '#ff5722',
            laserH: GAME_H, life: 1.0
          });
        }
      }
      if (e.laserActive > 0) e.laserActive = Math.max(0, e.laserActive - dt);

    } else if (e.typeName === 'freezer') {
      e.y += e.spd * dt;
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.y > 30 && e.y < GAME_H - 200) {
        e.shootTimer = rnd(2.0, 3.5);
        // Aim at player
        const dx0 = player.x - e.x, dy0 = player.y - e.y;
        const dist = Math.hypot(dx0, dy0) || 1;
        const speed = 220;
        spawnEnemyBullet(e.x, e.y, dx0/dist * speed, dy0/dist * speed, {
          w: 14, type: 'freeze', color: '#a5f3fc'
        });
        SFX.enemyShoot();
      }

    } else if (e.typeName === 'swarm') {
      // Tiny homing
      const dx0 = player.x - e.x, dy0 = player.y - e.y;
      const dist = Math.hypot(dx0, dy0) || 1;
      const home = 0.6;
      e.x += (dx0/dist * e.spd * home + 0) * dt;
      e.y += (dy0/dist * e.spd * home + e.spd * (1 - home)) * dt;
      e.angle += dt * 6;

    } else if (e.typeName === 'splitter') {
      e.y += e.spd * dt;
      e.x += Math.sin(frameCount * 0.04) * 20 * dt;

    } else {
      e.y += e.spd * dt;
    }

    e.angle += e.rotSpd * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt * 5;

    // Passed the player
    if (e.y > GAME_H + e.h) {
      if (e.typeName === 'boss' || e.typeName === 'megaboss' || e.typeName === 'phantomboss') {
        bossActive = false;
      }
      if (puShield > 0) {
        puShield = 0;
        SFX.shield();
        shakeScreen(8);
        spawnParticles(player.x, player.y, '#00f5ff', 20, 300, 0.5);
        spawnFloatText(player.x, player.y - 30, 'SHIELD BROKEN!', '#00f5ff', 13);
        return false;
      }
      missed++;
      lives = Math.max(0, lives - 1);
      SFX.miss();
      shakeScreen(15);
      spawnParticles(e.x, GAME_H - 20, e.color, 16, 180, 0.5);
      updateHUD();
      if (missed >= 5 || lives <= 0) setTimeout(endGame, 100);
      return false;
    }

    return true;
  });

  // ── Bullet ↔ Enemy collisions ──
  bullets = bullets.filter(b => {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      // Ghost while invisible cannot be hit
      if (e.typeName === 'ghost' && e.phaseState === 'invisible') continue;
      if (rectOverlap(b.x, b.y - b.h/2, b.w, b.h, e.x, e.y, e.w, e.h)) {
        const dmg = b.dmg;
        e.hp -= dmg;
        e.hitFlash = 1;
        shakeScreen(3);

        const crit = Math.random() < 0.15;
        if (crit) {
          SFX.crit();
          spawnFloatText(e.x, e.y - 20, 'CRIT!', '#ffbe0b', 13);
          e.hp--;
        }

        const isBoss = (e.typeName === 'boss' || e.typeName === 'megaboss' || e.typeName === 'phantomboss');
        if (isBoss) SFX.bossHit(); else SFX.hit();

        if (e.hp <= 0) {
          kills++;
          levelKills++;
          comboCount++;
          comboTimer = 2.5;
          if (comboCount > maxCombo) maxCombo = comboCount;

          const mult = 1 + (comboCount > 1 ? Math.floor(comboCount / 2) * 0.25 : 0);
          const pts = Math.floor(e.score * mult);
          score += pts;

          SFX.explode();
          shakeScreen(isBoss ? 20 : 6);
          spawnParticles(e.x, e.y, e.color, isBoss ? 30 : 14, 220, 0.7);

          const txt = crit ? `+${pts} CRIT!` : comboCount >= 3 ? `+${pts} x${comboCount}!` : `+${pts}`;
          const tColor = crit ? '#ffbe0b' : comboCount >= 3 ? '#fb5607' : '#fff';
          spawnFloatText(e.x, e.y - 10, txt, tColor, crit ? 15 : 12);

          if (isBoss) {
            bossActive = false;
            spawnFloatText(GAME_W/2, GAME_H/2 - 60, 'BOSS DEFEATED!', '#ffbe0b', 18);
            spawnPowerup(e.x - 30, e.y);
            spawnPowerup(e.x + 30, e.y);
          } else if (e.typeName === 'splitter') {
            // Split into 2 drones
            spawnEnemyOfType('drone_split', e.x - 14, e.y);
            spawnEnemyOfType('drone_split', e.x + 14, e.y);
            spawnFloatText(e.x, e.y - 22, 'SPLIT!', '#10b981', 12);
          } else if (e.reward === 'random' && Math.random() < 0.7) {
            spawnPowerup(e.x, e.y);
          } else if (Math.random() < 0.08) {
            spawnPowerup(e.x, e.y);
          }

          enemies.splice(ei, 1);
          checkLevelUp();
        }
        return false;
      }
    }
    return true;
  });

  // ── Player ↔ Enemy collision (FIXED: use filter, not forEach+splice) ──
  if (player.invincible <= 0) {
    enemies = enemies.filter(e => {
      // Ghost while invisible can't collide
      if (e.typeName === 'ghost' && e.phaseState === 'invisible') return true;
      if (!rectOverlap(player.x, player.y, player.w * 0.7, player.h * 0.7, e.x, e.y, e.w * 0.8, e.h * 0.8)) return true;

      if (puShield > 0) {
        puShield = 0;
        SFX.shield();
        shakeScreen(10);
        spawnParticles(player.x, player.y, '#00f5ff', 20, 300, 0.5);
        spawnFloatText(player.x, player.y - 30, 'SHIELD!', '#00f5ff', 14);
        return false;
      }
      lives--;
      missed++;
      player.invincible = 2.0;
      SFX.death();
      shakeScreen(20);
      spawnParticles(player.x, player.y, '#ff006e', 24, 280, 0.8);
      spawnFloatText(player.x, player.y - 30, 'HIT!', '#ff006e', 16);
      updateHUD();
      if (lives <= 0 || missed >= 5) setTimeout(endGame, 100);
      return false;
    });
  }

  // Powerups
  powerups = powerups.filter(pu => {
    pu.y += pu.vy * dt;
    pu.pulse += dt * 3;
    pu.life -= dt;
    if (pu.life <= 0) return false;

    if (rectOverlap(player.x, player.y, player.w, player.h, pu.x, pu.y, pu.r * 2, pu.r * 2)) {
      SFX.powerup();
      if (pu.t === 'rapid') puRapid = PU_DUR;
      if (pu.t === 'big') puBig = PU_DUR;
      if (pu.t === 'shield') puShield = PU_DUR;
      if (pu.t === 'multi') puMulti = PU_DUR;
      const names = { rapid:'RAPID FIRE', big:'BIG SHOT', shield:'SHIELD', multi:'TRISHOT' };
      spawnFloatText(player.x, player.y - 40, names[pu.t], pu.color, 13);
      return false;
    }
    return true;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.drag; p.vy *= p.drag;
    p.vy += 40 * dt;
    p.life -= dt;
    return p.life > 0;
  });

  // Floating texts
  floatingTexts = floatingTexts.filter(ft => {
    ft.y += ft.vy * dt;
    ft.life -= dt * 1.2;
    return ft.life > 0;
  });

  updateHUD();
}

// ─── Boss shooting patterns ──────────────────────────────────────
function bossShoot(e) {
  if (e.typeName === 'boss') {
    // 3-way spread
    e.shootTimer = rnd(1.4, 2.0);
    SFX.enemyShoot();
    [-0.3, 0, 0.3].forEach(a => {
      const sp = 240;
      spawnEnemyBullet(e.x, e.y + e.h/2, Math.sin(a) * sp, Math.cos(a) * sp, {
        w: 9, color: '#ffbe0b', type: 'normal'
      });
    });
  } else if (e.typeName === 'megaboss') {
    // 5-way barrage
    e.shootTimer = rnd(1.6, 2.4);
    SFX.enemyShoot();
    [-0.5, -0.25, 0, 0.25, 0.5].forEach(a => {
      const sp = 220;
      spawnEnemyBullet(e.x, e.y + e.h/2, Math.sin(a) * sp, Math.cos(a) * sp, {
        w: 10, color: '#fb5607', type: 'normal'
      });
    });
  } else if (e.typeName === 'phantomboss') {
    // Freeze bombs in all directions
    e.shootTimer = rnd(2.4, 3.4);
    SFX.freeze();
    const N = 8;
    for (let i = 0; i < N; i++) {
      const ang = (Math.PI * 2 / N) * i + e.bossTimer * 0.3;
      const sp = 180;
      spawnEnemyBullet(e.x, e.y, Math.cos(ang) * sp, Math.sin(ang) * sp, {
        w: 12, color: '#a5f3fc', type: 'freeze'
      });
    }
  }
}

// ─── Level Up ────────────────────────────────────────────────────
function checkLevelUp() {
  if (levelKills >= killsToLevel) {
    levelKills = 0;
    level++;
    bossesSpawnedThisCycle = 0;
    killsToLevel = 10 + level * 2;
    SFX.level();
    announceLevel(`LEVEL ${level}`);
  }
}

let announceTimeout;
function announceLevel(msg) {
  const el = document.getElementById('levelAnnounce');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(announceTimeout);
  announceTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

// ─── HUD Update ──────────────────────────────────────────────────
let _lastScore = 0, _lastLevel = 1;
function bumpEl(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 150);
}

function updateHUD() {
  const scoreEl = document.getElementById('scoreDisplay');
  const levelEl = document.getElementById('levelDisplay');
  scoreEl.textContent = score.toLocaleString();
  levelEl.textContent = level;
  if (score !== _lastScore && score > _lastScore) bumpEl(scoreEl);
  if (level !== _lastLevel) bumpEl(levelEl);
  _lastScore = score; _lastLevel = level;
  document.getElementById('missedDisplay').textContent = `${missed}/5`;

  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`life${i}`);
    el.classList.toggle('lost', i >= lives);
  }

  const comboEl = document.getElementById('comboDisplay');
  if (comboCount >= 2 && comboTimer > 0) {
    comboEl.textContent = `COMBO x${comboCount}`;
    comboEl.style.opacity = '1';
    comboEl.style.fontSize = Math.min(18, 11 + comboCount) + 'px';
  } else {
    comboEl.style.opacity = '0';
  }

  // Frozen indicator
  const frEl = document.getElementById('frozenIndicator');
  frEl.style.opacity = playerFreezeTimer > 0 ? '1' : '0';

  updatePU('rapid', puRapid);
  updatePU('big', puBig);
  updatePU('shield', puShield);
  updatePU('multi', puMulti);
}

function updatePU(name, ms) {
  const icon = document.getElementById(`pu-${name}`);
  const timer = document.getElementById(`pu-${name}-t`);
  if (ms > 0) {
    icon.classList.add('active');
    timer.textContent = (ms / 1000).toFixed(1) + 's';
  } else {
    icon.classList.remove('active');
    timer.textContent = '';
  }
}

// ─── Render ───────────────────────────────────────────────────────
function render() {
  ctx.save();
  if (screenShake > 0) ctx.translate(shakeX, shakeY);

  const dt = 1/60;
  drawBackground(dt);

  ctx.strokeStyle = '#00f5ff33';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(0, GAME_H - 65);
  ctx.lineTo(GAME_W, GAME_H - 65);
  ctx.stroke();
  ctx.setLineDash([]);

  powerups.forEach(drawPowerup);
  bullets.forEach(drawBullet);
  enemies.forEach(drawEnemy);
  enemyBullets.forEach(drawEnemyBullet);
  particles.forEach(drawParticle);
  drawPlayer();
  floatingTexts.forEach(drawFloatingText);

  ctx.restore();
}

// ─── Game Loop ────────────────────────────────────────────────────
let rafId = null;
function loop(ts) {
  if (state !== 'playing') return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  rafId = requestAnimationFrame(loop);
}

// ─── Game Control ────────────────────────────────────────────────
function startGame() {
  score = 0; level = 1; missed = 0; kills = 0;
  comboCount = 0; maxCombo = 0; comboTimer = 0;
  levelKills = 0; killsToLevel = 10;
  frameCount = 0; spawnTimer = 0;
  bullets = []; enemies = []; particles = []; floatingTexts = []; powerups = [];
  enemyBullets = [];
  bossActive = false; bossesSpawnedThisCycle = 0;
  lives = 3; player.x = GAME_W/2; player.invincible = 0;
  puRapid = 0; puBig = 0; puShield = 0; puMulti = 0;
  playerFreezeTimer = 0;
  screenShake = 0; shakeX = 0; shakeY = 0;

  document.getElementById('startScreen').classList.remove('visible');
  document.getElementById('gameOverScreen').classList.remove('visible');
  document.getElementById('pauseScreen').classList.remove('visible');
  document.getElementById('levelAnnounce').style.opacity = '0';

  // Resume/init audio (mobile gesture requirement)
  if (!ac) getAC();
  if (ac && ac.state === 'suspended') ac.resume();

  state = 'playing';
  updateHUD();

  if (rafId) cancelAnimationFrame(rafId);
  lastTime = performance.now();
  rafId = requestAnimationFrame(loop);

  announceLevel('LEVEL 1');
}

function endGame() {
  if (state !== 'playing') return;
  state = 'gameover';
  SFX.death();
  shakeScreen(30);
  spawnParticles(player.x, player.y, '#ff006e', 40, 320, 1.2);

  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalCombo').textContent = maxCombo;
  document.getElementById('gameOverScreen').classList.add('visible');

  const afterLoop = (ts) => {
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    particles = particles.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      p.life -= dt;
      return p.life > 0;
    });
    floatingTexts = floatingTexts.filter(ft => {
      ft.y += ft.vy * dt; ft.life -= dt * 1.2; return ft.life > 0;
    });
    render();
    if (particles.length > 0 || floatingTexts.length > 0) requestAnimationFrame(afterLoop);
  };
  requestAnimationFrame(afterLoop);
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    document.getElementById('pauseScreen').classList.add('visible');
    cancelAnimationFrame(rafId);
  } else if (state === 'paused') {
    state = 'playing';
    document.getElementById('pauseScreen').classList.remove('visible');
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', togglePause);

// ─── Idle render loop for start screen (single source of truth — no double-move) ──
function idleLoop(ts) {
  if (state !== 'start' && state !== 'paused') return;
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  frameCount++;
  // drawBackground updates star positions itself — don't update them again here
  drawBackground(dt);
  if (state === 'start') requestAnimationFrame(idleLoop);
}
requestAnimationFrame(idleLoop);

// Make sure resize fires after layout settles
setTimeout(resize, 50);
window.addEventListener('load', resize);

})();
</script>
